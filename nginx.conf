# GSM Frontend — hardened Nginx configuration
# - Serves compiled static assets from /usr/share/nginx/html
# - Strict CSP, HSTS-friendly headers, immutable cache for hashed/asset files
# - SPA fallback to /index.html for client-side routing
# - Built-in gzip for text payloads

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers (all responses) ──────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy   "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;

    # CSP — locked down. Adjust if you self-host fonts (fonts.gstatic.com can be dropped).
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com data:;
        img-src 'self' data: https:;
        connect-src 'self' https://api.gsm.app wss:;
        frame-ancestors 'none';
        form-action 'self';
        base-uri 'self';
        object-src 'none';
        upgrade-insecure-requests;
    " always;

    # ── Compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/vnd.api+json
        image/svg+xml;

    # ── Hashed / versioned static assets — long-lived immutable cache ────
    location ~* \.(css|js|mjs|svg|png|jpg|jpeg|gif|ico|webp|avif|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # ── config.js — short cache (rebuilds change API base) ───────────────
    location = /dist/config.js {
        expires 5m;
        add_header Cache-Control "public, must-revalidate" always;
        add_header Content-Type "application/javascript" always;
        access_log off;
        try_files $uri =404;
    }

    # ── /dist/ — short cache, no listing ────────────────────────────────
    location /dist/ {
        autoindex off;
        expires 1h;
        add_header Cache-Control "public, must-revalidate" always;
        try_files $uri =404;
    }

    # ── SPA fallback ────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # ── Health check (for Dokploy/k8s) ──────────────────────────────────
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── Hide Nginx version in errors ────────────────────────────────────
    server_tokens off;
}
