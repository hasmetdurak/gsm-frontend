name: GSM Frontend CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  docker-build-test:
    name: Docker Build Test (Nginx static)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker Image (Dry-Run)
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: gsm-frontend:latest

  deploy-vps:
    name: Deploy Frontend to Dokploy VPS
    runs-on: ubuntu-latest
    needs: docker-build-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Dokploy WebHook (gsm-frontend)
        run: |
          if [ -n "${{ secrets.DOKPLOY_WEBHOOK_URL_FRONTEND }}" ]; then
            echo "Triggering Dokploy webhook for gsm-frontend..."
            curl -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL_FRONTEND }}"
          else
            echo "DOKPLOY_WEBHOOK_URL_FRONTEND secret is not set. Skipping automated webhook trigger."
            echo "Dokploy will auto-deploy if GitHub integration is enabled in Dokploy Panel."
          fi
